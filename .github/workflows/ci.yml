name: Canonical Source Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reject generated snapshot markers
        run: |
          set -e
          for fn in mcp mcp-v3 mcp-options mcp-htsc mcp-handoff mcp-outcomes; do
            file="supabase/functions/$fn/index.ts"
            if grep -En 'reverse-synced ESZip runtime snapshot|@ts-nocheck' "$file"; then exit 1; fi
          done
      - name: Strict Edge Function type checks
        run: |
          set -e
          for fn in mcp mcp-v3 mcp-options mcp-htsc mcp-handoff mcp-outcomes codespace-control-register codespace-wake; do deno check "supabase/functions/$fn/index.ts"; done
      - name: Run gateway tests
        run: |
          set -e
          deno test --allow-read=. supabase/functions/mcp-v3/lib supabase/functions/mcp-options/lib supabase/functions/mcp-outcomes/lib supabase/functions/mcp-htsc tests
      - name: Verify option snapshot migration contract
        run: |
          set -e
          migration="supabase/migrations/20260902011000_option_snapshots.sql"
          test -f "$migration"
          grep -q 'option_chain_snapshots' "$migration"
          grep -q 'option_contract_snapshots' "$migration"
      - name: Verify Codespace control registry contract
        run: |
          set -e
          migration="supabase/migrations/20260903010000_codespace_control_registry.sql"
          test -f "$migration"
          grep -q 'enable row level security' "$migration"
          grep -q 'revoke all on table public.codespace_control_registry from anon, authenticated' "$migration"
          test -f ".devcontainer/devcontainer.json"
          test -f "scripts/codespace-control-bootstrap.sh"
          test -f "scripts/codespace-control-server.py"
      - name: Verify decision handoff contract
        run: |
          set -e
          migration="supabase/migrations/20260904012000_decision_handoffs.sql"
          test -f "$migration"
          grep -q 'decision_handoffs' "$migration"
          grep -q 'enable row level security' "$migration"
          grep -q 'revoke all on table public.decision_handoffs from anon, authenticated' "$migration"
          grep -q 'handoff_put' supabase/functions/mcp-handoff/index.ts
          grep -q 'handoff_get' supabase/functions/mcp-handoff/index.ts
          grep -q 'handoff_list_day' supabase/functions/mcp-handoff/index.ts
      - name: Verify decision outcome contract
        run: |
          set -e
          migration="supabase/migrations/20260905010000_decision_outcomes.sql"
          test -f "$migration"
          grep -q 'decision_outcomes' "$migration"
          grep -q 'enable row level security' "$migration"
          grep -q 'revoke all on table public.decision_outcomes from anon, authenticated' "$migration"
          grep -q 'decision_outcomes_settled_has_return' "$migration"
          for tool in outcome_record outcome_get outcome_scorecard; do
            grep -q "$tool" supabase/functions/mcp-outcomes/index.ts
          done
          grep -q 'violatesLookahead' supabase/functions/mcp-outcomes/index.ts
          grep -q 'allSettled' supabase/functions/mcp/index.ts
      - name: Verify provider neutrality
        run: |
          set -e
          grep -q 'const PROVIDERS:Upstream\[\]' supabase/functions/mcp-v3/index.ts
          grep -q 'timeoutSignal(' supabase/functions/mcp-v3/index.ts
          grep -q 'listAllProviders' supabase/functions/mcp-v3/index.ts
          if grep -n 'return jres(id,await callUpstream(jin10,"tools/call"' supabase/functions/mcp-v3/index.ts; then
            echo "tools/call must not fall through to a provider" >&2; exit 1
          fi
          for dead in findHi hiTools; do
            if grep -qw "$dead" supabase/functions/mcp-v3/index.ts; then
              echo "dead helper $dead still present" >&2; exit 1
            fi
          done
          echo "provider neutrality holds"
      - name: Reject trading capability in the outcome module
        run: |
          set -e
          if grep -rInE '(submit_order|cancel_order|place_order|ht_submit|transfer_funds)' supabase/functions/mcp-outcomes/; then
            echo "outcome module must remain read-and-settle only" >&2
            exit 1
          fi
          echo "no trading capability detected"
      - name: Scan repository for literal credentials
        run: |
          set -e
          if grep -RInE '(github_pat_[A-Za-z0-9_]{20,}|ht_[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{30,})' supabase README.md docs scripts .github tests 2>/dev/null; then exit 2; else echo "No literal credential pattern detected"; fi
