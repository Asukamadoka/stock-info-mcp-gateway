name: Canonical Source Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reject generated snapshot markers
        run: |
          set -e
          for fn in mcp mcp-v3 mcp-options mcp-htsc; do
            file="supabase/functions/$fn/index.ts"
            if grep -En 'reverse-synced ESZip runtime snapshot|@ts-nocheck' "$file"; then exit 1; fi
          done
      - name: Strict Edge Function type checks
        run: |
          set -e
          for fn in mcp mcp-v3 mcp-options mcp-htsc codespace-control-register; do deno check "supabase/functions/$fn/index.ts"; done
      - name: Run gateway tests
        run: |
          set -e
          deno test --allow-read=. supabase/functions/mcp-v3/lib supabase/functions/mcp-options/lib supabase/functions/mcp-htsc tests
      - name: Verify option snapshot migration contract
        run: |
          set -e
          migration="supabase/migrations/20260902011000_option_snapshots.sql"
          test -f "$migration"
          grep -q 'option_chain_snapshots' "$migration"
          grep -q 'option_contract_snapshots' "$migration"
      - name: Verify Codespace control registry contract
        run: |
          set -e
          migration="supabase/migrations/20260903010000_codespace_control_registry.sql"
          test -f "$migration"
          grep -q 'enable row level security' "$migration"
          grep -q 'revoke all on table public.codespace_control_registry from anon, authenticated' "$migration"
          test -f ".devcontainer/devcontainer.json"
          test -f "scripts/codespace-control-bootstrap.sh"
          test -f "scripts/codespace-control-server.py"
      - name: Scan repository for literal credentials
        run: |
          set -e
          if grep -RInE '(github_pat_[A-Za-z0-9_]{20,}|ht_[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{30,})' supabase README.md docs scripts .github tests 2>/dev/null; then exit 2; else echo "No literal credential pattern detected"; fi
